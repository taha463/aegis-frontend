name: Aegis Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Principle of Least Privilege (CWE-275 / CodeQL)
permissions:
  contents: read

jobs:
  quality-gate:
    name: Test & Build Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Unit & Integration Tests (28 Tests)
        run: npm test

      - name: Build Production Bundle (Vite)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "mock_ci_key"
          VITE_FIREBASE_AUTH_DOMAIN: "mock_ci.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "mock_ci"
          VITE_FIREBASE_STORAGE_BUCKET: "mock_ci.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
          VITE_FIREBASE_APP_ID: "1:1234567890:web:abcdef"
